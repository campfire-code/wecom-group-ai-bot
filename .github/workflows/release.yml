# 篝火：打 v*-campfire.* 标签时构建 Docker 镜像并发布（流程定义在 campfire-code/toolkit-hub）
name: release
on:
  push:
    tags: ['v*-campfire.*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    uses: campfire-code/toolkit-hub/.github/workflows/docker-release.yml@v1
    with:
      context: .
      dockerfile: docker/Dockerfile.campfire
